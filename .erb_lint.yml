---
EnableDefaultLinters: true
glob: "app/views/**/*.html.erb"
exclude:
  - "**/vendor/**/*"
  - "**/node_modules/**/*"

linters:
  # ERB内のRubyコードを、既存の .rubocop.yml（omakase）のルールでチェックする
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      # ERBはRubyファイルの「断片」なので、ファイル単位を前提にしたCopは無効化する
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Layout/LeadingEmptyLines:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
      Rails/OutputSafety:
        Enabled: false